[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "downer"
version = "1.0.0"
description = "Universal Cobalt-style media downloader"
authors = [{ name = "Imaad Irshad" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn",
    "yt-dlp",
    "imageio-ffmpeg",
    "pydantic"
]
