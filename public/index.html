<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>downer</title>
<meta name="description" content="Minimal media downloader. Paste a link from YouTube, SoundCloud, TikTok and more." />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/css/vars.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/omnibox.css" />
<link rel="stylesheet" href="/css/buttons.css" />
<link rel="stylesheet" href="/css/segmented.css" />
<link rel="stylesheet" href="/css/formats.css" />
<link rel="stylesheet" href="/css/inspect.css" />
<link rel="stylesheet" href="/css/feedback.css" />
</head>
<body>

<header>
  <span class="brand-name">downer</span>
</header>

<main>
  <div class="omnibox">
    <div class="omnibox-row">
      <svg class="omnibox-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <input
        id="url-input"
        class="omnibox-input"
        type="text"
        placeholder="Paste a YouTube, SoundCloud, TikTok or file link…"
        autocomplete="off"
        spellcheck="false"
        autofocus
        aria-label="Media URL"
      />
      <button class="paste-btn" id="paste-btn" aria-label="Paste from clipboard">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Paste
      </button>
      <button class="go-btn" id="go-btn" title="Download" aria-label="Download">
        <svg id="go-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="4" x2="12" y2="15"/><polyline points="7 10 12 15 17 10"/><line x1="5" y1="20" x2="19" y2="20"/></svg>
      </button>
    </div>
  </div>

  <div class="options">
    <div class="segmented" id="mode-seg" role="group" aria-label="Download mode">
      <button class="seg-btn active" data-mode="audio">Audio</button>
      <button class="seg-btn" data-mode="video">Video</button>
      <button class="seg-btn" data-mode="file">File</button>
    </div>
    <div class="formats" id="format-row"></div>
  </div>

  <div id="inspect-slot" style="width:100%"></div>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
