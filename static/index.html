<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cobalt — Universal Media & Stream Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d13;
      --bg-surface: #12151f;
      --bg-card: #181c28;
      --bg-card-hover: #1f2433;
      --border: #242a3b;
      --border-focus: #6366f1;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --text: #f8fafc;
      --text-muted: #8e9bb0;
      --text-dim: #5a667a;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 450px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(11, 13, 19, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 13, 19, 0.75);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 16px 28px;
    }

    .header-inner {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.03em;
    }

    .brand-badge {
      font-size: 0.68rem;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid transparent;
      outline: none;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-secondary {
      background: var(--bg-surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--bg-card);
      color: var(--text);
      border-color: #3b455e;
    }

    main {
      max-width: 780px;
      margin: 0 auto;
      padding: 60px 20px 100px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .hero-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      text-align: center;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 36px;
    }

    .omnibox-container {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 8px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
      transition: var(--transition);
      position: relative;
    }

    .omnibox-container:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 4px var(--accent-glow), 0 20px 48px rgba(0, 0, 0, 0.5);
    }

    .omnibox-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 6px 4px 14px;
    }

    .omnibox-icon {
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .omnibox-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1.05rem;
      padding: 10px 0;
      outline: none;
      font-family: inherit;
    }

    .omnibox-input::placeholder {
      color: var(--text-dim);
    }

    .paste-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .paste-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .download-trigger-btn {
      background: var(--accent);
      color: white;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 14px var(--accent-glow);
      flex-shrink: 0;
    }
    .download-trigger-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.05);
    }
    .download-trigger-btn:active {
      transform: scale(0.96);
    }

    .options-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      padding: 10px 14px 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .pill-group {
      display: flex;
      background: var(--bg);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .pill-btn.active {
      background: var(--bg-card);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .format-pills {
      display: flex;
      gap: 6px;
    }

    .format-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'JetBrains Mono', monospace;
    }

    .format-btn:hover {
      border-color: #3b455e;
      color: var(--text);
    }

    .format-btn.active {
      background: rgba(99, 102, 241, 0.15);
      border-color: var(--accent);
      color: #a5b4fc;
    }

    .inspect-card {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .inspect-thumb {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      object-fit: cover;
      background: var(--bg-card);
      flex-shrink: 0;
    }

    .inspect-info {
      flex: 1;
      min-width: 0;
    }

    .inspect-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .inspect-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .platform-pill {
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .tray-container {
      width: 100%;
      margin-top: 36px;
    }

    .tray-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .tray-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tray-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tray-item {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: var(--transition);
      animation: slideUp 0.2s ease-out;
    }

    .tray-item-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .tray-item-title {
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .tray-item-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
    }

    .status-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .status-queued { background: rgba(142, 155, 176, 0.15); color: #8e9bb0; }
    .status-downloading { background: rgba(99, 102, 241, 0.15); color: #818cf8; }
    .status-processing { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .status-completed { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .status-failed { background: rgba(239, 68, 68, 0.15); color: #f87171; }

    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: var(--bg);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(to right, #6366f1, #38bdf8);
      width: 0%;
      transition: width 0.3s ease;
    }

    .supported-platforms {
      margin-top: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      color: var(--text-dim);
      font-size: 0.8rem;
    }

    .platform-tag {
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      background: #181c28;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      border: 1px solid #2d374d;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
      font-size: 0.85rem;
      animation: slideUp 0.2s ease-out;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </div>
        <span class="brand-title">cobalt</span>
        <span class="brand-badge">local engine</span>
      </div>

      <div class="header-actions">
        <button class="btn btn-secondary" onclick="openDownloadsFolder()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          Folder
        </button>
      </div>
    </div>
  </header>

  <main>
    <h1 class="hero-title">Paste. Download. Done.</h1>
    <p class="hero-subtitle">Fast, ad-free stream & file extraction across any site.</p>

    <div class="omnibox-container">
      <div class="omnibox-input-row">
        <svg class="omnibox-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        
        <input 
          type="text" 
          id="url-input" 
          class="omnibox-input" 
          placeholder="Paste SoundCloud, YouTube, TikTok, Twitter link or any file URL..." 
          autocomplete="off" 
          autofocus 
          oninput="handleInput(this.value)"
          onkeydown="handleKey(event)"
        />

        <button class="paste-btn" onclick="pasteFromClipboard()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          Paste
        </button>

        <button class="download-trigger-btn" id="start-btn" onclick="startDownload()" title="Download (Enter)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <polyline points="19 12 12 19 5 12"></polyline>
          </svg>
        </button>
      </div>

      <div class="options-row">
        <div class="pill-group">
          <button class="pill-btn active" id="mode-audio" onclick="setMode('audio')">Audio</button>
          <button class="pill-btn" id="mode-video" onclick="setMode('video')">Video</button>
          <button class="pill-btn" id="mode-raw" onclick="setMode('raw')">Direct File</button>
        </div>

        <div class="format-pills" id="format-container"></div>
      </div>
    </div>

    <div id="inspect-container" style="width:100%; display:none;"></div>

    <div class="tray-container">
      <div class="tray-header">
        <div class="tray-title">
          <span>Downloads</span>
          <span style="font-size:0.75rem; color:var(--text-dim);" id="queue-count">(0)</span>
        </div>
        <button class="btn btn-secondary" onclick="clearCompletedQueue()" style="padding:4px 10px; font-size:0.75rem;">Clear Completed</button>
      </div>

      <div class="tray-list" id="tray-list">
        <div style="text-align:center; padding:32px 12px; color:var(--text-dim); font-size:0.85rem;">
          No active downloads. Paste a link above to start.
        </div>
      </div>
    </div>

    <div class="supported-platforms">
      <span class="platform-tag">SoundCloud</span>
      <span class="platform-tag">YouTube</span>
      <span class="platform-tag">TikTok</span>
      <span class="platform-tag">Twitter / X</span>
      <span class="platform-tag">Instagram</span>
      <span class="platform-tag">Reddit</span>
      <span class="platform-tag">Direct .zip / .pdf / .mp3</span>
    </div>
  </main>

  <div class="toast-container" id="toast-container"></div>

  <script>
    let currentMode = 'audio';
    let currentFormat = 'mp3';
    let activeInspectedData = null;
    let inspectDebounce = null;

    const FORMAT_OPTIONS = {
      audio: [
        { id: 'mp3', label: 'MP3 (320k)' },
        { id: 'wav', label: 'WAV' },
        { id: 'flac', label: 'FLAC' },
        { id: 'm4a', label: 'M4A' }
      ],
      video: [
        { id: 'mp4_best', label: 'Best Quality' },
        { id: 'mp4_1080', label: '1080p' },
        { id: 'mp4_720', label: '720p' }
      ],
      raw: [
        { id: 'raw', label: 'Original File' }
      ]
    };

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.pill-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`mode-${mode}`);
      if (activeBtn) activeBtn.classList.add('active');

      currentFormat = FORMAT_OPTIONS[mode][0].id;
      renderFormatPills();
    }

    function setFormat(fmt) {
      currentFormat = fmt;
      renderFormatPills();
    }

    function renderFormatPills() {
      const container = document.getElementById('format-container');
      const options = FORMAT_OPTIONS[currentMode] || [];
      container.innerHTML = options.map(opt => `
        <button class="format-btn ${opt.id === currentFormat ? 'active' : ''}" onclick="setFormat('${opt.id}')">
          ${opt.label}
        </button>
      `).join('');
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (text && text.trim().startsWith('http')) {
          const input = document.getElementById('url-input');
          input.value = text.trim();
          handleInput(input.value);
          showToast('Pasted link from clipboard');
        } else {
          showToast('Clipboard does not contain a valid URL', 'warning');
        }
      } catch (err) {
        showToast('Please press Ctrl+V to paste', 'info');
      }
    }

    function handleKey(e) {
      if (e.key === 'Enter') {
        startDownload();
      }
    }

    function handleInput(val) {
      clearTimeout(inspectDebounce);
      const url = val.trim();
      const inspectBox = document.getElementById('inspect-container');

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        inspectBox.style.display = 'none';
        activeInspectedData = null;
        return;
      }

      inspectDebounce = setTimeout(() => {
        inspectUrl(url);
      }, 350);
    }

    async function inspectUrl(url) {
      const inspectBox = document.getElementById('inspect-container');
      try {
        const resp = await fetch('/api/inspect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        if (!resp.ok) return;
        const data = await resp.json();
        activeInspectedData = data;

        const thumb = data.thumbnail || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' fill='%231f2433'><rect width='80' height='80'/></svg>";
        
        inspectBox.innerHTML = `
          <div class="inspect-card">
            <img src="${thumb}" class="inspect-thumb" onerror="this.style.opacity=0.3" alt="" />
            <div class="inspect-info">
              <div class="inspect-title" title="${escapeHtml(data.title)}">${escapeHtml(data.title)}</div>
              <div class="inspect-meta">
                <span class="platform-pill">${escapeHtml(data.platform || 'Web')}</span>
                <span>${escapeHtml(data.uploader || '')}</span>
                ${data.duration_formatted ? `<span>• ${data.duration_formatted}</span>` : ''}
              </div>
            </div>
          </div>
        `;
        inspectBox.style.display = 'block';
      } catch (err) {
        inspectBox.style.display = 'none';
      }
    }

    async function startDownload() {
      const input = document.getElementById('url-input');
      const url = input.value.trim();
      if (!url) {
        showToast('Please paste a link first', 'warning');
        return;
      }

      const btn = document.getElementById('start-btn');
      btn.innerHTML = '<div class="spinner"></div>';
      btn.disabled = true;

      try {
        const payload = {
          url: url,
          mode: currentMode,
          format: currentFormat,
          title: activeInspectedData ? activeInspectedData.title : null,
          thumbnail: activeInspectedData ? activeInspectedData.thumbnail : null,
        };

        const resp = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || 'Download failed to queue');

        showToast('Added to download queue!');
        input.value = '';
        document.getElementById('inspect-container').style.display = 'none';
        activeInspectedData = null;
        fetchQueue();
      } catch (err) {
        showToast(err.message, 'danger');
      } finally {
        btn.innerHTML = `
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <polyline points="19 12 12 19 5 12"></polyline>
          </svg>
        `;
        btn.disabled = false;
      }
    }

    async function fetchQueue() {
      try {
        const res = await fetch('/api/queue');
        if (!res.ok) return;
        const data = await res.json();
        renderQueue(data.queue || []);
      } catch (_) {}
    }

    function renderQueue(queue) {
      const countEl = document.getElementById('queue-count');
      const listEl = document.getElementById('tray-list');
      countEl.innerText = `(${queue.length})`;

      if (!queue.length) {
        listEl.innerHTML = `<div style="text-align:center; padding:32px 12px; color:var(--text-dim); font-size:0.85rem;">No active downloads. Paste a link above to start.</div>`;
        return;
      }

      let html = '';
      queue.forEach(item => {
        let badge = '';
        let showProgress = false;

        switch(item.status) {
          case 'queued':
            badge = '<span class="status-badge status-queued">Queued</span>';
            break;
          case 'downloading':
            badge = `<span class="status-badge status-downloading">${item.speed || 'Downloading'}</span>`;
            showProgress = true;
            break;
          case 'processing':
            badge = '<span class="status-badge status-processing">Converting</span>';
            showProgress = true;
            break;
          case 'completed':
            badge = '<span class="status-badge status-completed">Ready</span>';
            break;
          case 'failed':
            badge = '<span class="status-badge status-failed">Failed</span>';
            break;
        }

        html += `
          <div class="tray-item">
            <div class="tray-item-main">
              <span class="tray-item-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</span>
              
              <div style="display:flex; align-items:center; gap:8px;">
                <span class="platform-pill">${escapeHtml(item.format.toUpperCase())}</span>
                ${badge}
                ${item.status === 'completed' ? `
                  <a href="/api/download-file/${encodeURIComponent(item.filename)}" download class="btn btn-secondary" style="padding:4px 10px; font-size:0.78rem;">
                    Save
                  </a>
                ` : ''}
                <button class="btn btn-secondary" onclick="removeQueueItem('${item.id}')" style="padding:4px 8px; font-size:0.75rem; border:none;" title="Dismiss">✕</button>
              </div>
            </div>

            ${showProgress ? `
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: ${item.progress}%"></div>
              </div>
            ` : ''}

            ${item.status === 'failed' ? `
              <span style="font-size:0.75rem; color:#ef4444;">${escapeHtml(item.error || 'Error occurred')}</span>
            ` : ''}
          </div>
        `;
      });

      listEl.innerHTML = html;
    }

    async function removeQueueItem(id) {
      await fetch(`/api/queue/${id}`, { method: 'DELETE' });
      fetchQueue();
    }

    async function clearCompletedQueue() {
      await fetch('/api/queue/clear-completed', { method: 'POST' });
      fetchQueue();
    }

    async function openDownloadsFolder() {
      try {
        const res = await fetch('/api/open-downloads-folder', { method: 'POST' });
        if (res.ok) showToast('Opened downloads folder in File Explorer!');
      } catch (_) {
        showToast('Could not open folder', 'warning');
      }
    }

    function showToast(msg, type = 'info') {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerText = msg;
      c.appendChild(t);
      setTimeout(() => { t.remove(); }, 3000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
    }

    renderFormatPills();
    fetchQueue();
    setInterval(fetchQueue, 1200);
  </script>
</body>
</html>
